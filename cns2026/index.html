<style>
/* Layout: phone-first lookup tool — sticky search + tab bar, dense badge-style rows, full-screen person sheet. Role ribbons echo conference badge ribbons. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --line:#d9dfe6;
  --ink:#122033; --ink-2:#4a5868; --ink-3:#7b8794;
  --accent:#0b6c74; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --chair:#8c1d2f; --pd:#1d4f9c; --apd:#2b7a57; --fac:#5f6773;
  --met:#0b6c74; --warn:#9a5b00;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1520; --surface:#152130; --surface-2:#1b2a3b; --line:#2a3a4d;
  --ink:#e8eef5; --ink-2:#a8b5c4; --ink-3:#7d8b9b;
  --accent:#4cc3c9; --accent-ink:#06262a; --accent-soft:#163a40;
  --chair:#e0707f; --pd:#7aa7ec; --apd:#6cc59b; --fac:#9aa3ae; --met:#4cc3c9; --warn:#e3a54a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1520; --surface:#152130; --surface-2:#1b2a3b; --line:#2a3a4d;
  --ink:#e8eef5; --ink-2:#a8b5c4; --ink-3:#7d8b9b;
  --accent:#4cc3c9; --accent-ink:#06262a; --accent-soft:#163a40;
  --chair:#e0707f; --pd:#7aa7ec; --apd:#6cc59b; --fac:#9aa3ae; --met:#4cc3c9; --warn:#e3a54a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-left:6px}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sync.bad{color:var(--warn)}
.search{position:relative;padding-block:4px 8px}
.search input{width:100%;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:0 40px 0 14px;font-size:16px}
.search button{position:absolute;right:6px;top:8px;height:36px;width:36px;border:0;background:none;color:var(--ink-3);font-size:20px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:0 8px}
nav.tabs button{height:36px;border-radius:8px;border:0;background:none;font-weight:600;font-size:14px;color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.count{font-family:var(--f-mono);font-size:11px;opacity:.85;margin-left:3px}

main{padding-block:12px 80px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.meta{font-size:12px;color:var(--ink-3);margin:0 0 8px}

.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px;text-align:left;width:100%}
.row:active{background:var(--surface-2)}
.row .txt{min-width:0}
.row .nm{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub2{font-size:12px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--met)}
.tick.off{background:none;border:1.5px dashed var(--line);color:transparent}

.av{position:relative;width:60px;height:72px;border-radius:7px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--ink-3);font-size:18px}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.av .rb{position:absolute;left:0;right:0;bottom:0;height:5px}
.rb.Chair{background:var(--chair)} .rb.Program-Director{background:var(--pd)} .rb.Associate-Program-Director{background:var(--apd)} .rb.Faculty{background:var(--fac)}
.role{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:#fff}
.role.Chair{background:var(--chair)} .role.Program-Director{background:var(--pd)} .role.Associate-Program-Director{background:var(--apd)} .role.Faculty{background:var(--fac)}
:root[data-theme="dark"] .role{color:#0d1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .role{color:#0d1520}}

.more{display:block;margin:12px auto 0;height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}

/* Programs */
.st{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-3);margin:16px 0 6px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.prog .pn{font-weight:600;min-width:0}
.prog .pc{font-size:12px;color:var(--ink-3)}
.prog .faces{display:flex;flex:none}
.prog .faces .av{width:30px;height:36px;border-radius:5px;margin-left:-6px;border:2px solid var(--surface);font-size:11px}
.prog .faces .av .rb{height:3px}

/* Schedule */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;text-align:center;min-width:62px}
.day b{display:block;font-family:var(--f-display);font-size:15px}
.day span{font-size:11px;color:var(--ink-3)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.8}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:78px 1fr;gap:10px}
.sess .tm{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.35}
.sess .tm .rm{display:block;color:var(--ink-3);margin-top:4px;overflow-wrap:anywhere}
.sess .st2{min-width:0}
.sess .ttl{font-weight:600;line-height:1.3}
.sess .ty{font-size:12px;color:var(--ink-3);margin-top:2px}
.ppl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:18px;padding:2px 10px 2px 2px;font-size:12px;font-weight:600;max-width:100%}
.pchip .av{width:28px;height:28px;border-radius:50%;font-size:10px}
.pchip .av .rb{display:none}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{border:0;background:none;font-size:18px;color:var(--ink-3);padding:0 2px;line-height:1}
.star[aria-pressed="true"]{color:var(--warn)}
.live{font-size:12px;font-weight:700;letter-spacing:.03em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.live.now{color:var(--chair)} .live.soon{color:var(--accent)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--chair);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}} @media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
.talks{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.talk{text-align:left;border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--ink-2);line-height:1.35}
.talk b{color:var(--ink)} .talk .tt{font-family:var(--f-mono);font-size:11px;color:var(--accent)} .talk.on .tt{color:var(--chair);font-weight:700}
.day.live-day b{color:var(--chair)} .day.live-day[aria-pressed="true"] b{color:inherit}
.stoggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:2px 0 10px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sbar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;gap:10px}
.back{border:0;background:none;font-weight:600;color:var(--accent);font-size:16px;padding:8px 0}
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:end;padding-block:16px 4px}
.hero .av{width:132px;height:162px;border-radius:10px;font-size:34px}
.hero .av .rb{height:8px}
.hero h2{font-family:var(--f-display);font-size:24px;line-height:1.1;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.hero .cred{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.hero .ttl{font-size:13px;color:var(--ink-2);margin-top:6px}
@media (max-width:380px){.hero{grid-template-columns:110px 1fr}.hero .av{width:110px;height:136px}.hero h2{font-size:21px}}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.kv>div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0}
.kv dt{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--met);color:var(--accent-ink);border-color:var(--met)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.sec{font-family:var(--f-display);font-size:16px;font-weight:600;margin:22px 0 8px}
textarea{width:100%;min-height:110px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px;resize:vertical}
.saved{font-size:12px;color:var(--ink-3);margin-top:4px;min-height:16px}
.fu{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.fu label{display:flex;align-items:center;gap:6px}
.fu input{width:20px;height:20px;accent-color:var(--accent)}
.want{color:#c98a00}
.btn.know-on{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink)}
.known{display:inline-block;margin-left:6px;font-family:var(--f-body,inherit);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:2px}
.absent{color:var(--ink-3);font-weight:400;font-size:.9em}
.legend{white-space:nowrap}
.nowtxt{color:#b4233c;font-weight:600}
.btn.want-on{background:#fff4d6;border-color:#e0b44a;color:#7a5200}
.pchip.want{border-color:#e0b44a;background:#fff8e6;color:#5c3d00}
.note.flag{background:#fff4e0;color:#7a4b00}
.note{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:10px}
.mails{font-family:var(--f-mono);font-size:13px;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.form{display:grid;gap:10px}
.form input{height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;width:100%}
.form label{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:grid;gap:4px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;height:48px;padding:0 18px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sumcard b{font-family:var(--f-display);font-size:22px}
</style>

<header>
  <div class="wrap">
    <div class="hrow"><h1 class="brand">Faculty Finder<small>CNS 2026 · DC</small></h1><span class="sync" id="sync">Connecting…</span></div>
    <div class="search"><input id="q" type="search" placeholder="Search name, program, city, specialty" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search"><button id="qx" aria-label="Clear search" hidden>×</button></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="people" aria-selected="true">People</button>
      <button role="tab" data-tab="programs" aria-selected="false">Programs</button>
      <button role="tab" data-tab="schedule" aria-selected="false">Schedule</button>
      <button role="tab" data-tab="met" aria-selected="false">My list<span class="count" id="metCount"></span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="sheet" id="sheet" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const PROGS = D.programs, PEOPLE = D.people;
const ROLE_ORDER = {"Chair":0,"Program Director":1,"Associate Program Director":2,"Faculty":3};
const ROLE_SHORT = {"Chair":"Chair","Program Director":"PD","Associate Program Director":"APD","Faculty":"Faculty"};
const byId = new Map(PEOPLE.map(p=>[p.id,p]));
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
PEOPLE.forEach(p=>{ const g=PROGS[p.pg]; p._hay = norm([p.n,g.name,g.inst,g.city,g.state,p.s,p.t].join(' ')); p._last = norm(p.n.replace(/,.*$/,'').trim().split(/\s+/).pop()); });

const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const e=document.createElement(tag); if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue; if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k, v===true?'':v);} kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); }); return e; };
const roleCls = r => r.replace(/ /g,'-');
const initials = n => n.replace(/,.*$/,'').split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).map(w=>w[0]).filter((_,i,a)=>i===0||i===a.length-1).join('').toUpperCase();
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('Copied'); }catch(e){ toast('Select the text to copy'); } }
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ---------- Photos (official headshots, chunked supporting files) ---------- */
const photoCache = new Map(); const chunkLoads = new Map();
function loadChunk(i){ if(!chunkLoads.has(i)) chunkLoads.set(i, fetch('photos_'+i+'.json').then(r=>r.ok?r.json():{}).then(j=>{ for(const k in j) photoCache.set(k,j[k]); }).catch(()=>{})); return chunkLoads.get(i); }
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ io.unobserve(en.target); fillPhoto(en.target); } }); },{rootMargin:'300px'}) : null;
function fillPhoto(box){ const id=box.dataset.pid; const p=byId.get(id); const extra = state.contacts[id] && state.contacts[id].photo;
  const set = src => { if(!src) return; box.textContent=''; box.append(el('img',{src,alt:'',decoding:'async'})); if(box._rb) box.append(box._rb); };
  if(extra){ set('/_blob/'+extra); return; }
  if(!p || p.ph<0) return;
  if(photoCache.has(id)){ set(photoCache.get(id)); return; }
  loadChunk(p.ph).then(()=>set(photoCache.get(id)));
}
function avatar(p, opts){ opts=opts||{}; const box=el('div',{class:'av'+(opts.cls?' '+opts.cls:''),'data-pid':p.id,'aria-hidden':'true'}, p.ini||initials(p.n)); const rb=el('div',{class:'rb '+roleCls(p.r||'Faculty')}); box.append(rb); box._rb=rb; if(opts.now||!io) fillPhoto(box); else io.observe(box); return box; }

const DAYS=[['October 31, 2026','Sat','Oct 31'],['November 01, 2026','Sun','Nov 1'],['November 02, 2026','Mon','Nov 2'],['November 03, 2026','Tue','Nov 3'],['November 04, 2026','Wed','Nov 4']];

let softT; function softRender(){ if(!$('#sheet').hidden){ if(sheetRefresh) sheetRefresh(); return; } clearTimeout(softT); softT=setTimeout(()=>{ const y=scrollY; render(); scrollTo(0,y); },120); }

/* ---------- Sheets ---------- */
let sheetRefresh=null; const stack=[];
function openSheet(build){ const sh=$('#sheet'); stack.push(build); sh.hidden=false; document.body.style.overflow='hidden'; build(sh); sh.scrollTop=0; }
function closeSheet(){ stack.pop(); const sh=$('#sheet'); if(stack.length){ stack[stack.length-1](sh); } else { sh.hidden=true; sh.textContent=''; sheetRefresh=null; document.body.style.overflow=''; render(); } }
function bar(title){ return el('div',{class:'sbar'}, el('div',{class:'wrap'}, el('button',{class:'back',onclick:closeSheet},'‹ Back'), el('span',{class:'sync'},title||''))); }
function openPerson(id){ openSheet(sh=>buildPerson(sh,id)); }
function buildPerson(sh,id){
  const p=byId.get(id); const g=PROGS[p.pg]; sh.textContent='';
  const c=()=>state.contacts[id]||{};
  const w=el('div',{class:'wrap',style:'padding-bottom:40px'});
  const metBtn=el('button',{class:'btn'+(c().met?' on':' primary'),onclick:()=>{ const now=!c().met; saveContact(id,{met:now, metAt: now?(c().metAt||new Date().toISOString()):c().metAt}); metBtn.className='btn'+(now?' on':' primary'); metBtn.textContent=now?'✓ Met':'I met them'; toast(now?'Marked as met':'Unmarked'); }}, c().met?'✓ Met':'I met them');
  const notes=el('textarea',{id:'notes-'+id,placeholder:'Where you met, what you talked about, what to follow up on…'}); notes.value=c().notes||'';
  const savedMsg=el('div',{class:'saved'});
  let nt; notes.addEventListener('input',()=>{ clearTimeout(nt); savedMsg.textContent='Saving…'; nt=setTimeout(()=>{ const patch={notes:notes.value}; if(!c().met && notes.value.trim()){ patch.met=true; patch.metAt=new Date().toISOString(); metBtn.className='btn on'; metBtn.textContent='✓ Met'; } saveContact(id,patch); savedMsg.textContent= state.dbOk?'Saved':'Saved on this phone; syncs when online'; },700); });
  const emailed=el('input',{type:'checkbox',id:'em-'+id}); emailed.checked=!!c().emailed; emailed.addEventListener('change',()=>saveContact(id,{emailed:emailed.checked}));
  const big=avatar(p,{now:true});
  w.append(el('div',{class:'hero'}, big, el('div',{style:'min-width:0'}, el('h2',{},isWant(id)?el('span',{class:'want'},'★ '):null,p.n,absentTag(id)), p.cred?el('div',{class:'cred'},p.cred):null, el('span',{class:'role '+roleCls(p.r)}, p.r+(p.r2?' · '+p.r2:'')), el('div',{class:'ttl'}, p.t))));
  if(p.fl) w.append(el('div',{class:'note flag'},'⚠ ', p.fl));
  if(offProg(id)) w.append(el('div',{class:'note'}, ABSENT+' Not on the CNS 2026 program (no talk, panel or moderator role), so likely not attending.'));
  if(p.pf) w.append(el('div',{class:'note'},'Public figure: no headshot is stored for this person. Use the profile link, or add your own photo.'));
  const wantBtn=el('button',{class:'btn'+(isWant(id)?' want-on':''),onclick:()=>{ const now=!isWant(id); saveContact(id,{want:now}); wantBtn.className='btn'+(now?' want-on':''); wantBtn.textContent=now?'★ Looking for':'☆ Look for'; toast(now?'Added to Looking for':'Removed from Looking for'); }}, isWant(id)?'★ Looking for':'☆ Look for');
  const knowBtn=el('button',{class:'btn'+(isKnow(id)?' know-on':''),onclick:()=>{ const now=!isKnow(id); saveContact(id,{know:now}); knowBtn.className='btn'+(now?' know-on':''); knowBtn.textContent=now?'✓ Know them':'Know them'; toast(now?'Marked as someone you know':'Unmarked'); }}, isKnow(id)?'✓ Know them':'Know them');
  if(state.readonly) w.append(el('div',{class:'btns'}, p.u? el('a',{class:'btn',href:p.u,target:'_blank',rel:'noopener'},'Profile ↗'):null));
  else w.append(el('div',{class:'btns'}, metBtn, wantBtn, knowBtn, p.u? el('a',{class:'btn',href:p.u,target:'_blank',rel:'noopener'},'Profile ↗'):null, assets? el('button',{class:'btn',onclick:()=>pickPhoto(async blob=>{ const r=await assets.upload(blob,{type:'image/jpeg'}); saveContact(id,{photo:r.id}); toast('Photo added'); buildPerson(sh,id); })}, c().photo?'Replace photo':'Add my photo'):null));
  const kv=el('dl',{class:'kv'});
  const add=(k,v)=>{ if(v) kv.append(el('div',{}, el('dt',{},k), el('dd',{},v))); };
  add('Program', el('button',{class:'back',style:'padding:0;font-size:15px;text-align:left',onclick:()=>openProgram(p.pg)}, g.name));
  add('Hospital', g.inst); add('City', g.city+', '+g.state); add('Focus', p.s);
  if(p.e) add('Email', el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap'}, el('span',{class:'mails'},p.e), el('button',{class:'btn sm',onclick:()=>copy(p.e)},'Copy')));
  else add('Email', el('span',{style:'color:var(--ink-3)'},'Not publicly listed. Check the profile page'));
  add('Why notable', p.note);
  if(p.v) add('Checked', el('span',{style:'color:var(--ink-3)'},'Verified against official pages, Oct 31, 2026'));
  w.append(kv);
  if(!state.readonly) w.append(el('div',{class:'sec'},'Your notes'), notes, savedMsg, el('div',{class:'fu'}, el('label',{for:'em-'+id}, emailed, 'Follow-up email sent')));
  // sessions
  w.append(el('div',{class:'sec'},'At CNS 2026'));
  const ap = S && S.byPerson[id];
  if(!S) w.append(el('div',{class:'meta'},'Loading the program…'));
  else if(!ap || !ap.length) w.append(el('div',{class:'meta'},'Not listed as faculty in the CNS 2026 online program. They may still attend.'));
  else { const l=el('div',{class:'list'}); ap.slice().sort((a,b)=> DAYS.findIndex(d=>d[0]===S.sessions[a[0]].d)-DAYS.findIndex(d=>d[0]===S.sessions[b[0]].d) || timeVal(a[3]||S.sessions[a[0]].tm)-timeVal(b[3]||S.sessions[b[0]].tm)).forEach(a=>{ const s=S.sessions[a[0]]; const dd=DAYS.find(d=>d[0]===s.d); l.append(el('div',{class:'sess'}, el('div',{class:'tm'}, (dd?dd[1]+' '+dd[2]:s.d), el('br'), a[3]||s.tm, s.r?el('span',{class:'rm'},s.r):null), el('div',{class:'st2'}, el('div',{class:'ttl'}, a[1]||s.t), a[1]? el('div',{class:'ty'}, 'in '+s.t):null, el('div',{class:'ty'}, [a[2]||'Faculty', s.ty].filter(Boolean).join(' · '))))); }); w.append(l); }
  w.append(el('p',{class:'meta',style:'margin-top:16px'}, 'Role confirmed from the department’s website. ', p.src? el('a',{href:p.src,target:'_blank',rel:'noopener',style:'color:var(--accent)'},'Source ↗'):null));
  sh.append(bar(ROLE_SHORT[p.r]+' · '+g.state), w);
  sheetRefresh=()=>{ if(document.activeElement!==notes){ notes.value=c().notes||''; } emailed.checked=!!c().emailed; };
}
function openProgram(i){ openSheet(sh=>{ const g=PROGS[i]; sh.textContent=''; const w=el('div',{class:'wrap',style:'padding-block:16px 40px'});
  w.append(el('h2',{style:'font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance'}, g.name), el('div',{class:'meta'}, [g.inst, g.city+', '+g.state].filter(Boolean).join(' · ')), g.flag? el('div',{class:'note flag',style:'margin:0 0 10px'},'⚠ ', g.flag):null);
  w.append(el('div',{class:'btns',style:'margin-bottom:12px'}, g.deptUrl?el('a',{class:'btn sm',href:g.deptUrl,target:'_blank',rel:'noopener'},'Department ↗'):null, g.resUrl?el('a',{class:'btn sm',href:g.resUrl,target:'_blank',rel:'noopener'},'Residency ↗'):null));
  const l=el('div',{class:'list'}); sortPeople(PEOPLE.filter(p=>p.pg===i)).forEach(p=>l.append(personRow(p))); w.append(l);
  sh.append(bar(g.state), w); sheetRefresh=null; }); }
function openExtra(id){ openSheet(sh=>{ sh.textContent=''; const x=Object.assign({name:'',org:'',email:'',notes:'',emailed:false}, id?state.extras[id]:{}); const key=id||('x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const f=el('form',{class:'form'}); const inp=(lab,k,type)=>{ const i=el('input',{id:'x-'+k,type:type||'text',value:x[k]||''}); f.append(el('label',{for:'x-'+k},lab,i)); return i; };
  const n=inp('Name','name'), o=inp('Program or company','org'), e=inp('Email','email','email');
  const t=el('textarea',{id:'x-notes',placeholder:'Where you met and what to follow up on'}); t.value=x.notes||''; f.append(el('label',{for:'x-notes'},'Notes',t));
  const em=el('input',{type:'checkbox',id:'x-em'}); em.checked=!!x.emailed; f.append(el('div',{class:'fu'}, el('label',{for:'x-em'},em,'Follow-up email sent')));
  let photo=x.photo||null;
  const btns=el('div',{class:'btns'}, el('button',{class:'btn primary',type:'submit'},'Save'), assets?el('button',{class:'btn',type:'button',onclick:()=>pickPhoto(async blob=>{ const r=await assets.upload(blob,{type:'image/jpeg'}); photo=r.id; toast('Photo added'); })}, photo?'Replace photo':'Add photo'):null);
  f.append(btns);
  f.addEventListener('submit',ev=>{ ev.preventDefault(); if(!n.value.trim()){ toast('Add a name first'); n.focus(); return; } saveExtra(key,{name:n.value.trim(),org:o.value.trim(),email:e.value.trim(),notes:t.value,emailed:em.checked,photo,metAt:x.metAt||new Date().toISOString()}); toast('Saved'); closeSheet(); });
  const w=el('div',{class:'wrap',style:'padding-block:16px 40px'}, el('h2',{style:'font-family:var(--f-display);font-size:22px;margin:0 0 12px'}, id?'Edit contact':'Add someone not in the directory'), f);
  sh.append(bar('Met'), w); sheetRefresh=null; }); }
function pickPhoto(cb){ const inp=$('#photoInput'); inp.value=''; inp.onchange=async()=>{ const file=inp.files&&inp.files[0]; if(!file) return; try{ toast('Uploading…'); const bmp=await createImageBitmap(file); const s=Math.min(1,640/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82)); await cb(blob); }catch(e){ toast(e&&e.code==='rate_limited'?'Too many uploads. Wait a moment':'Photo upload failed'); } }; inp.click(); }

/* ---------- Wiring ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{ state.tab=b.dataset.tab; state.limit=60; render(); scrollTo(0,0); }));
const q=$('#q'), qx=$('#qx'); let qt;
q.addEventListener('input',()=>{ qx.hidden=!q.value; clearTimeout(qt); qt=setTimeout(()=>{ state.q=norm(q.value.trim()); state.limit=60; render(); },120); });
qx.addEventListener('click',()=>{ q.value=''; qx.hidden=true; state.q=''; render(); q.focus(); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });
refreshCounts(); render();
setInterval(()=>{ if(((state.tab==='schedule' && state.day==='now')||state.tab==='met') && $('#sheet').hidden){ const y=scrollY; render(); scrollTo(0,y); } }, 60000);
function setReadonly(label){ state.readonly=true; setSync(label); document.querySelector('nav.tabs button[data-tab=met]').hidden=true; document.querySelector('nav.tabs').style.gridTemplateColumns='repeat(3,1fr)'; if(state.tab==='met') state.tab='people'; render(); }
const STATIC = !!document.querySelector('meta[name="cns-static"]');
if(STATIC){ setReadonly('Lab edition'); if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} } }
else if(window.claude && claude.use) initStore(); else { state.dbOk=false; setSync('Notes save on this phone only',true); }
})();
</script>
